<form class="card" x-data="cosplayForm()" hx-post="/new-cosplay" hx-target="this" hx-swap="outerHTML"
    hx-encoding="multipart/form-data">

    {{ if .Created }}

    <div class="notification is-success">
        Cosplay criado com sucesso!
    </div>
    {{ end }}
    
    <div class="card-content">
        <div class="content">
            <div class="columns is-centered">
                <div class="column is-half">
                    <div class="field">
                        <label class="label">Name</label>
                        <div class="control">
                            <input class="input" type="text" name="nome" required>
                        </div>
                    </div>


                    <div class="field">
                        <label class="label">Descrição</label>
                        <div class="control">
                            <input class="input" type="text" name="desc" placeholder="Personagem | origem" required>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Email</label>
                        <div class="control">
                            <input class="input" type="email" name="email" required>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Numero</label>
                        <div class="control">
                            <input class="input" x-mask="(99) 9 9999-9999" type="text" name="numero" required>
                        </div>
                    </div>


                    <div class="file">
                        <label class="file-label">
                            <input class="input" type="file" name="foto" accept="image/*" capture="camera"
                                @change="previewImage" required>
                            <span class="file-cta">
                                <span class="file-icon">
                                    <i class="fas fa-upload"></i>
                                </span>
                                <span class="file-label"> Escolha uma foto… </span>
                            </span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="card-image">
        <figure class="image">
            <img style="max-height: 60vh;" :src="imagePreview" alt="Cosplay image">
        </figure>
    </div>
    <footer class="card-footer">
        <button class="card-footer-item button is-success is-light" type="submit">
            <span class="icon">
                <i class="fas fa-thumbs-up"></i>
            </span>
            <span>Salvar</span>
        </button>
        <button class="card-footer-item button is-danger is-light" type="reset">
            <span class="icon">
                <i class="fas fa-thumbs-down"></i>
            </span>
            <span>Descartar</span>
        </button>
    </footer>

</form>
